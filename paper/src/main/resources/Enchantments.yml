# Enchantment Types:
# - Armor ~ All armor
# - Helmet
# - Boots
# - Chestplate
# - Leggings
# - Bow
# - Axe
# - Sword
# - PickAxe
# - Hoe
# - Tool ~ Pickaxes, Axes, Shovels, Hoes, and Shears
# - All ~ All items listed here
##########
# Chance System
#
# Chance-System:
#   Base: # Starting chance.
#   Increase: # The amount it goes up each level.
# Multi-Type (optional, overrides Enchantment-Type):
# Enchantment-Types:
#   - 'Sword'
#   - 'Axe'
# Strength (optional):
# For most enchants: one value per level (example: 1, 2, 3).
# Rage special format: "multiplier / hits" (example: "1.5 / 30").
##########
